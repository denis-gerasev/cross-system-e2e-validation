name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # run_local_tests.sh waits for the dev server with no limit of its own;
    # this stops a server that never starts from burning the 6-hour default.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json pins 14.17.3, but firebase-tools (devDependency) needs a newer
          # Node; use whatever you run locally if it differs.
          node-version: 20
          cache: npm
          cache-dependency-path: react-shopping-cart/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      # Starts the React app, waits for port 3000, runs pytest, stops the app.
      # Missing npm dependencies are handled inside the script.
      - name: Run tests
        run: bash run_local_tests.sh
        env:
          TEST_ENV: local
          BROWSER: none
          PYTEST_ADDOPTS: --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            react-shopping-cart/npm_server.log
          if-no-files-found: ignore
